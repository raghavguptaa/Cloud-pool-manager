[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-pool-manager"
version = "1.0.0"
description = "Deterministic O(1) finite-state controller for EC2 Auto Scaling warm pools"
readme = "README.md"
license = { file = "LICENSE" }
# Pinned to the deployed Lambda runtime (python3.13), not the local interpreter, so
# nothing here can depend on a language feature the deployed function will not have.
# Lambda does also offer python3.14, but 3.13 carries the same support horizon
# (deprecation 2029-06-30) and is the version this was built and tested against.
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
    "moto[autoscaling,cloudwatch]>=5.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["governor", "sim", "finops"]

[tool.setuptools.package-data]
finops = ["pricing.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
